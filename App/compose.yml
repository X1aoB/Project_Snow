name: project-snow

services:
  api:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment:
      DATA_ROOT: /workspace/Data
      APP_RUNTIME: /workspace/App/runtime
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ../Data:/workspace/Data:ro
      - ./runtime:/workspace/App/runtime
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file: .env
    environment:
      DATA_ROOT: /workspace/Data
      APP_RUNTIME: /workspace/App/runtime
    volumes:
      - ../Data:/workspace/Data:ro
      - ./runtime:/workspace/App/runtime
    profiles: ["pipeline"]
    command: ["python", "-m", "pipelines.run_stage", "--stage", "b", "--skip-vector"]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_snow
      POSTGRES_USER: project_snow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in App/.env before starting Compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_snow -d project_snow"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in App/.env before starting Compose}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
