http_port 3128
acl SSL_ports port 443
acl CONNECT method CONNECT

# Variant B: a relay (第三方中转站) lets the user choose the upstream host, so a
# static dstdomain allowlist cannot enumerate it. Instead DENY every private,
# loopback, link-local, CGNAT, ULA and cloud-metadata destination FIRST, then
# allow any public host over CONNECT 443. The app-side relay_url validator
# refuses IP literals and internal names before a host is ever sealed; this is
# the network half that stops DNS-rebinding/SSRF to internal IPs the app cannot
# see resolved. Deny rules MUST precede every allow rule.
acl to_private dst 10.0.0.0/8
acl to_private dst 172.16.0.0/12
acl to_private dst 192.168.0.0/16
acl to_linklocal dst 169.254.0.0/16
acl to_loopback dst 127.0.0.0/8
acl to_cgnat dst 100.64.0.0/10
acl to_metadata dst 169.254.169.254/32
acl to_loopback6 dst ::1/128
acl to_ula6 dst fc00::/7
acl to_linklocal6 dst fe80::/10
acl to_metadata6 dst fd00:ec2::254/128
# 0.0.0.0/8 reaches the local host on Linux; the rest are reserved, test,
# benchmark and multicast ranges no public relay lives on. IPv4-mapped and
# NAT64 IPv6 forms would otherwise smuggle a private IPv4 past the v4 rules.
acl to_reserved dst 0.0.0.0/8
acl to_reserved dst 192.0.0.0/24
acl to_reserved dst 192.0.2.0/24
acl to_reserved dst 198.18.0.0/15
acl to_reserved dst 198.51.100.0/24
acl to_reserved dst 203.0.113.0/24
acl to_reserved dst 224.0.0.0/4
acl to_reserved dst 240.0.0.0/4
acl to_reserved6 dst ::/128
acl to_reserved6 dst ::ffff:0:0/96
acl to_reserved6 dst 64:ff9b::/96
acl to_reserved6 dst ff00::/8

# --- deny private/internal destinations before any allow ---
http_access deny to_private
http_access deny to_linklocal
http_access deny to_loopback
http_access deny to_cgnat
http_access deny to_metadata
http_access deny to_loopback6
http_access deny to_ula6
http_access deny to_linklocal6
http_access deny to_metadata6
http_access deny to_reserved
http_access deny to_reserved6

# The three official 1.1.0 vendor hosts stay explicitly reachable alongside the
# existing ones; they are a public-host superset, documented for operators.
acl official_domains dstdomain api.openai.com
acl official_domains dstdomain api.deepseek.com
acl official_domains dstdomain dashscope.aliyuncs.com
acl official_domains dstdomain open.bigmodel.cn
acl official_domains dstdomain api.moonshot.cn
acl official_domains dstdomain api.anthropic.com
acl official_domains dstdomain api.x.ai
acl official_domains dstdomain generativelanguage.googleapis.com
acl official_domains dstdomain challenges.cloudflare.com

# --- allow public TLS only, after the private denials above ---
http_access deny !SSL_ports
http_access allow CONNECT SSL_ports
http_access deny all
cache deny all
cache_log /var/log/squid/cache.log
access_log stdio:/var/log/squid/access.log
cache_store_log none
pinger_enable off
via off
forwarded_for delete
