shared_buffers = 1GB
effective_cache_size = 4GB
work_mem = 8MB
max_connections = 50
listen_addresses = '*'
wal_compression = on
# Public feedback and idempotency rows can contain conversation text. Keep
# PostgreSQL from writing SQL statements or bound parameters to container
# logs; latency is measured in the application without message bodies.
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = 'panic'
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
