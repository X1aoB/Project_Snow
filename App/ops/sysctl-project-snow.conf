# Conservative host tuning for a shared 16-vCPU / 16-GiB Debian VPS.
# Bound dirty writeback so shared storage does not receive multi-GiB bursts.
vm.swappiness = 4
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 250

# Neo4j/Qdrant mmap usage and local development file watchers.
vm.max_map_count = 1048576
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Bounded public API and provider connection queues.
net.core.default_qdisc = fq
net.core.somaxconn = 4096
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_syncookies = 1

# Low-risk kernel information and filesystem hardening.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
