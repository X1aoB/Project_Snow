<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Project Snow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside id="contact-panel" class="contact-panel" aria-label="角色会话">
        <header class="product-header">
          <div class="product-mark" aria-hidden="true">S</div>
          <div>
            <strong>Project Snow</strong>
            <span id="connection-status" class="connection-status">正在连接</span>
          </div>
          <button id="close-contacts" class="icon-button mobile-only" type="button" aria-label="关闭角色列表" title="关闭角色列表">
            <i data-lucide="x"></i>
          </button>
        </header>

        <label class="contact-search">
          <i data-lucide="search" aria-hidden="true"></i>
          <input id="character-search" type="search" placeholder="搜索角色" autocomplete="off" />
        </label>
        <div id="character-list" class="character-list" role="listbox" aria-label="选择角色"></div>

        <footer class="contact-footer">
          <button id="open-global-feedback" class="footer-command" type="button">
            <i data-lucide="message-square-warning"></i><span>问题反馈</span>
          </button>
          <a class="footer-command" href="/workspace/">
            <i data-lucide="database"></i><span>后台工作台</span>
          </a>
          <button id="open-settings" class="icon-button" type="button" aria-label="设置" title="设置">
            <i data-lucide="settings"></i>
          </button>
        </footer>
      </aside>

      <main class="chat-panel">
        <header class="chat-header">
          <button id="open-contacts" class="icon-button mobile-only" type="button" aria-label="打开角色列表" title="角色列表">
            <i data-lucide="panel-left"></i>
          </button>
          <div id="active-character" class="active-character">
            <div class="avatar avatar-fallback">?</div>
            <div>
              <h1>选择角色</h1>
              <p>从左侧开始一段对话</p>
            </div>
          </div>
          <div class="chat-controls" aria-label="对话控制">
            <div id="mode-control" class="segmented-control" role="group" aria-label="对话模式">
              <button type="button" data-mode="immersive" aria-pressed="true">沉浸式</button>
              <button type="button" data-mode="assistant" aria-pressed="false">助手</button>
            </div>
            <div id="channel-control" class="segmented-control" role="group" aria-label="交流媒介">
              <button type="button" data-channel="in_person" aria-pressed="true"><i data-lucide="users"></i><span>面对面</span></button>
              <button type="button" data-channel="text" aria-pressed="false"><i data-lucide="message-circle"></i><span>文字</span></button>
            </div>
            <button id="open-info" class="icon-button" type="button" aria-label="角色与场景信息" title="角色与场景信息">
              <i data-lucide="info"></i>
            </button>
          </div>
        </header>

        <div id="system-banner" class="system-banner" hidden></div>
        <section id="timeline" class="timeline" aria-live="polite" aria-label="对话记录">
          <div class="empty-conversation">
            <p>选择一位角色开始聊天。</p>
          </div>
        </section>

        <form id="composer" class="composer" autocomplete="off">
          <div id="request-status" class="request-status" aria-live="polite"></div>
          <div id="analyst-action-field" class="action-composer" hidden>
            <label for="action-input"><i data-lucide="hand"></i>动作或神态 <span>可选，可与对白同时发送</span></label>
            <textarea id="action-input" rows="1" maxlength="1200" aria-label="输入面对面动作或神态" placeholder="描述你的动作或神态（可选）…"></textarea>
          </div>
          <div class="composer-row">
            <textarea id="message-input" rows="1" maxlength="4000" aria-label="输入对白或消息" placeholder="输入消息…"></textarea>
            <button id="send-message" class="send-button" type="submit" aria-label="发送消息" title="发送">
              <i data-lucide="send"></i>
            </button>
          </div>
          <p class="composer-hint">Enter 发送 · Shift+Enter 换行</p>
        </form>
      </main>

      <aside id="info-panel" class="info-panel" aria-label="角色与场景信息" aria-hidden="true">
        <header>
          <div>
            <span class="panel-kicker">当前会话</span>
            <h2>角色与场景</h2>
          </div>
          <button id="close-info" class="icon-button" type="button" aria-label="关闭信息面板" title="关闭">
            <i data-lucide="x"></i>
          </button>
        </header>
        <div id="info-content" class="info-content"></div>
      </aside>
      <div id="drawer-scrim" class="drawer-scrim" hidden></div>
    </div>

    <dialog id="feedback-dialog" class="modal">
      <form id="feedback-form" method="dialog">
        <header>
          <div>
            <span class="panel-kicker">问题反馈</span>
            <h2>告诉我们哪里需要改进</h2>
          </div>
          <button class="icon-button" type="button" data-close-dialog="feedback-dialog" aria-label="关闭反馈" title="关闭"><i data-lucide="x"></i></button>
        </header>
        <fieldset id="feedback-categories" class="feedback-categories">
          <legend>问题范围</legend>
        </fieldset>
        <label class="feedback-detail">
          具体说明
          <textarea id="feedback-text" rows="5" maxlength="4000" required placeholder="请描述你看到的问题、期望的表现，或复现步骤。"></textarea>
        </label>
        <p id="feedback-context" class="modal-context"></p>
        <div class="modal-actions">
          <button type="button" class="secondary-button" data-close-dialog="feedback-dialog">取消</button>
          <button id="submit-feedback" type="submit" class="primary-button">提交反馈</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog" class="modal compact-modal">
      <form method="dialog">
        <header>
          <div>
            <span class="panel-kicker">本地测试产品</span>
            <h2>会话设置</h2>
          </div>
          <button class="icon-button" type="button" data-close-dialog="settings-dialog" aria-label="关闭设置" title="关闭"><i data-lucide="x"></i></button>
        </header>
        <div class="settings-section">
          <strong>清理当前角色记录</strong>
          <p>只删除本机聊天历史，不会修改角色资料、反馈或知识图谱。</p>
          <div class="settings-actions">
            <button id="clear-current-mode" type="button" class="secondary-button">清空当前模式</button>
            <button id="clear-character" type="button" class="danger-button">清空该角色全部对话</button>
          </div>
        </div>
        <div class="settings-section attribution">
          <strong>图片与资料</strong>
          <p>角色头像来自尘白禁区 Wiki 的公开页面引用，仅用于本地非商业测试；详细来源记录在头像清单中。</p>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>
    <script src="vendor/lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
