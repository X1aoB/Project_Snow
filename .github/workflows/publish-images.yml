name: publish-images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: App
          file: App/infra/public-api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/project_snow-public:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: App
          file: App/infra/embedding.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/project_snow-embedding:${{ github.sha }}
          provenance: mode=max
          sbom: true
