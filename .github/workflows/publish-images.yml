name: release-images

on:
  workflow_call:
    inputs:
      embedding_changed:
        required: true
        type: boolean
      previous_sha:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve lowercase GHCR image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "public=ghcr.io/$owner/project_snow-public" >> "$GITHUB_OUTPUT"
          echo "embedding=ghcr.io/$owner/project_snow-embedding" >> "$GITHUB_OUTPUT"
      - name: Build and push application image once
        id: public
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: App
          file: App/infra/public-api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.public }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=public-api
          cache-to: type=gha,mode=max,scope=public-api
      - name: Scan published application image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.public }}@${{ steps.public.outputs.digest }}
          format: json
          output: trivy-application.json
          exit-code: "0"
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - run: python App/scripts/report_trivy_findings.py trivy-application.json
      - name: Build and push changed embedding image
        if: inputs.embedding_changed
        id: embedding-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: App
          file: App/infra/embedding.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.embedding }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=embedding
          cache-to: type=gha,mode=max,scope=embedding
      - name: Reuse previous verified embedding digest
        if: ${{ !inputs.embedding_changed }}
        id: embedding-reuse
        shell: bash
        env:
          IMAGE: ${{ steps.images.outputs.embedding }}
          PREVIOUS_SHA: ${{ inputs.previous_sha }}
        run: |
          digest=""
          source_sha=""
          for candidate in $(git rev-list --first-parent "$PREVIOUS_SHA"); do
            if image_info="$(docker buildx imagetools inspect "$IMAGE:$candidate" 2>/dev/null)"; then
              digest="$(printf '%s\n' "$image_info" | awk '/^Digest:/ {print $2; exit}')"
              if [ -n "$digest" ]; then
                source_sha="$candidate"
                break
              fi
            fi
          done
          test -n "$digest"
          echo "Reusing verified embedding digest from main ancestor $source_sha."
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Select embedding digest
        id: embedding
        shell: bash
        env:
          BUILT: ${{ steps.embedding-build.outputs.digest }}
          REUSED: ${{ steps.embedding-reuse.outputs.digest }}
        run: |
          digest="${BUILT:-$REUSED}"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Tag reused embedding digest for the current main SHA
        if: ${{ !inputs.embedding_changed }}
        shell: bash
        env:
          IMAGE: ${{ steps.images.outputs.embedding }}
          DIGEST: ${{ steps.embedding.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" >/dev/null
      - name: Scan embedding image when rebuilt
        if: inputs.embedding_changed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.embedding }}@${{ steps.embedding.outputs.digest }}
          format: json
          output: trivy-embedding.json
          exit-code: "0"
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Enforce rebuilt embedding vulnerability gate
        if: inputs.embedding_changed
        run: python App/scripts/report_trivy_findings.py trivy-embedding.json
      - name: Generate immutable release manifest
        run: >-
          python App/scripts/release_manifest.py
          --sha "${{ github.sha }}"
          --public-image "${{ steps.images.outputs.public }}"
          --public-digest "${{ steps.public.outputs.digest }}"
          --embedding-image "${{ steps.images.outputs.embedding }}"
          --embedding-digest "${{ steps.embedding.outputs.digest }}"
          --output release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-snow-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish release summary
        shell: bash
        run: |
          {
            echo '## Project Snow release manifest'
            echo
            echo '```json'
            cat release-manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
