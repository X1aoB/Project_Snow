name: publish-images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve lowercase GHCR image names
        id: images
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "public=ghcr.io/$owner/project_snow-public" >> "$GITHUB_OUTPUT"
          echo "embedding=ghcr.io/$owner/project_snow-embedding" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: App
          file: App/infra/public-api.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.public }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: App
          file: App/infra/embedding.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.embedding }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
