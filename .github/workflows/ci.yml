name: required-checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.classify.outputs.ui }}
      api: ${{ steps.classify.outputs.api }}
      data: ${{ steps.classify.outputs.data }}
      embedding: ${{ steps.classify.outputs.embedding }}
      deploy: ${{ steps.classify.outputs.deploy }}
      app_image: ${{ steps.classify.outputs.app_image }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          python App/scripts/classify_changes.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --event "$GITHUB_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Reject committed secrets
        shell: bash
        run: |
          secret_pattern='(sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY|cloudflare_''tunnel_token=)'
          ! git grep -niE "$secret_pattern" -- ':!App/tests/**'
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/requirements-public.txt
      - run: pip install --require-hashes -r requirements-public.txt
      - run: pip install pytest
      - name: Public security and interface contracts
        run: >-
          python -m pytest
          tests/test_public_security.py
          tests/test_migration_secret_config.py
          tests/test_change_classifier.py
          tests/test_release_manifest.py
          tests/test_prepare_ci_runtime.py -q
      - name: Validate shared immersive design layer
        run: |
          python scripts/validate_shared_design.py
          python -m pytest tests/test_shared_design.py -q
      - run: python -m compileall -q backend migrations scripts
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: node --check public_frontend/app.js

  ui:
    if: github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/requirements.txt
      - run: pip install pytest playwright
      - name: Verify preinstalled Chrome for Playwright
        run: |
          command -v google-chrome
          google-chrome --version
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome")
              browser.close()
          PY
      - name: Prepare artwork-free UI contract fixture
        run: python scripts/prepare_ci_runtime.py --avatars
      - name: Static and browser UI tests
        env:
          RUN_PUBLIC_E2E: "1"
          PROJECT_SNOW_PLAYWRIGHT_CHANNEL: chrome
        run: python -m pytest tests/test_ui_v050.py tests/test_public_frontend_e2e.py -q
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - run: node --check public_frontend/app.js

  api:
    if: github.event_name == 'pull_request' && needs.changes.outputs.api == 'true'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/requirements-public.txt
      - run: pip install --require-hashes -r requirements-public.txt
      - run: pip install pytest
      - name: Public API unit and integration tests
        run: >-
          python -m pytest
          tests/test_public_api.py
          tests/test_deployment_contracts.py -q
      - name: Validate Alembic offline migration
        run: alembic upgrade head --sql > migration.sql
        env:
          PUBLIC_DATABASE_URL: postgresql+psycopg://project_snow:ci@postgres/project_snow

  data:
    if: github.event_name == 'pull_request' && needs.changes.outputs.data == 'true'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/requirements.txt
      - run: pip install -r requirements.txt
      - name: Prepare corpus-free data contract fixture
        run: python scripts/prepare_ci_runtime.py --views
      - name: Validate data release and architecture contracts
        run: >-
          python -m pytest
          tests/test_data_release.py
          tests/test_data_boundaries.py
          tests/test_mvp_22_product.py -q
      - name: Validate checked-out architecture artifacts when supplied
        run: |
          if [ -f runtime/manifest.json ]; then
            python scripts/validate_architecture.py
          else
            echo "::notice::No data release artifact is stored in Git; contract fixtures were validated instead."
          fi

  deploy:
    if: github.event_name == 'pull_request' && needs.changes.outputs.deploy == 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Validate production Compose
        working-directory: App
        env:
          PUBLIC_ENV_FILE: /tmp/project-snow-public.env
          PUBLIC_API_IMAGE: ghcr.io/example/public@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EMBEDDING_IMAGE: ghcr.io/example/embedding@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          CLOUDFLARED_IMAGE: cloudflare/cloudflared@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          CADDY_IMAGE: caddy@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
          POSTGRES_IMAGE: postgres@sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          QDRANT_IMAGE: qdrant/qdrant@sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          NEO4J_IMAGE: neo4j@sha256:1111111111111111111111111111111111111111111111111111111111111111
          EGRESS_PROXY_IMAGE: ubuntu/squid@sha256:2222222222222222222222222222222222222222222222222222222222222222
        run: |
          install -m 600 /dev/null /tmp/project-snow-public.env
          docker compose -f compose.prod.yml --profile blue --profile admin config --quiet
      - name: Validate shell and deployment contracts
        run: |
          find App/ops App/infra -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python -m py_compile App/scripts/bootstrap_release_host.py App/scripts/install_release_archive.py App/scripts/release_manifest.py
          PYTHONPATH=App python -m pytest App/tests/test_deployment_contracts.py App/tests/test_change_classifier.py App/tests/test_release_manifest.py -q

  app-image:
    if: >-
      github.event_name == 'pull_request' &&
      (needs.changes.outputs.app_image == 'true' || github.head_ref == 'codex/ci-risk-tiering')
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: App
          file: App/infra/public-api.Dockerfile
          push: false
          load: true
          tags: project-snow-public:ci
          cache-from: type=gha,scope=public-api
          cache-to: type=gha,mode=max,scope=public-api
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: project-snow-public:ci
          format: json
          output: trivy-application.json
          exit-code: "0"
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - run: python App/scripts/report_trivy_findings.py trivy-application.json
      - name: Container live check
        run: |
          docker run -d --name snow-public -p 18000:8000 \
            -e PUBLIC_ALLOW_INSECURE_DEV=true \
            -e PUBLIC_AUTO_CREATE_SCHEMA=true \
            -e PUBLIC_DATABASE_URL=sqlite+pysqlite:////tmp/public.db \
            -e PUBLIC_ENABLED_PROVIDERS= \
            -e PUBLIC_CREDENTIAL_KEY=eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg \
            -e PUBLIC_STATE_HMAC_KEY=eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg \
            -e PUBLIC_IP_HMAC_KEY=eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg \
            -e PUBLIC_QQ_KEY=eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg \
            -e PUBLIC_ADMIN_TOKEN=ci-only \
            project-snow-public:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18000/public/v1/health/live && exit 0; sleep 1; done
          docker logs snow-public
          exit 1

  embedding-image:
    if: >-
      (github.event_name == 'pull_request' &&
       (needs.changes.outputs.embedding == 'true' || github.head_ref == 'codex/ci-risk-tiering')) ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: App
          file: App/infra/embedding.Dockerfile
          push: false
          load: true
          tags: project-snow-embedding:ci
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=embedding
          cache-to: type=gha,mode=max,scope=embedding
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: project-snow-embedding:ci
          format: json
          output: trivy-embedding.json
          exit-code: "0"
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - run: python App/scripts/report_trivy_findings.py trivy-embedding.json
      - name: Embedding container 512-dimension inference check
        run: |
          cleanup() { docker rm -f snow-embedding >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name snow-embedding -p 18001:8000 project-snow-embedding:ci
          ready=false
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18001/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs snow-embedding
            exit 1
          fi
          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"inputs":["Project Snow 向量契约检查"]}' \
            http://127.0.0.1:18001/embed \
            | python -c 'import json, math, sys; payload = json.load(sys.stdin); vectors = payload["vectors"]; assert len(vectors) == 1 and len(vectors[0]) == 512; assert all(math.isfinite(value) for value in vectors[0])'

  full-validation:
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'codex/ci-risk-tiering'
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: App/requirements.txt
      - run: pip install -r requirements.txt
      - name: Verify preinstalled Chrome for Playwright
        run: |
          command -v google-chrome
          google-chrome --version
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(channel="chrome")
              browser.close()
          PY
      - name: Prepare generated contract fixtures
        run: python scripts/prepare_ci_runtime.py
      - name: Full portable Python suite
        run: >-
          python -m pytest tests
          -m "not runtime_data"
          --ignore=tests/test_public_frontend_e2e.py -q
      - name: Validate shared immersive design layer
        run: python scripts/validate_shared_design.py
      - name: Isolated public browser suite
        env:
          RUN_PUBLIC_E2E: "1"
          PROJECT_SNOW_PLAYWRIGHT_CHANNEL: chrome
        run: python -m pytest tests/test_public_frontend_e2e.py -q
      - name: Full private-runtime suite when a release is attached
        if: hashFiles('App/runtime/manifest.json') != ''
        run: python -m pytest tests -m runtime_data -q
      - name: Explain omitted private-runtime suite
        if: ${{ always() && hashFiles('App/runtime/manifest.json') == '' }}
        run: >-
          echo "::notice::The private/generated runtime data release is intentionally outside Git;
          runtime_data tests remain part of local validation and run here whenever a verified release is attached."
      - name: Full architecture validation when a release is attached
        run: |
          if [ -f runtime/manifest.json ]; then
            python scripts/validate_architecture.py
          else
            echo "::notice::Runtime data is intentionally outside Git; data release contract tests supplied the CI coverage."
          fi
      - name: Validate Alembic migration
        run: alembic upgrade head --sql > migration.sql
        env:
          PUBLIC_DATABASE_URL: postgresql+psycopg://project_snow:ci@postgres/project_snow

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [changes, security, contracts, full-validation]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      embedding_changed: ${{ needs.changes.outputs.embedding == 'true' }}
      previous_sha: ${{ github.event.before }}

  gate:
    if: always()
    needs:
      - changes
      - security
      - contracts
      - ui
      - api
      - data
      - deploy
      - app-image
      - embedding-image
      - full-validation
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Enforce every selected risk tier
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["NEEDS_JSON"])
          bad = {name: value["result"] for name, value in jobs.items() if value["result"] not in {"success", "skipped"}}
          if bad:
              raise SystemExit(f"selected CI jobs did not pass: {bad}")
          print("All selected risk-tier jobs passed or were intentionally skipped.")
          PY
