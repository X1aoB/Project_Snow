version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /App/public_frontend_src
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-build:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /App/client
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directory: /App
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /App/infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
